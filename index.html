<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#111214">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Gym</title>
<style>
:root{
  --bg:#111214;--s1:#1b1c20;--s2:#25272c;--line:#2f3137;--tx:#f3f3f5;--mu:#8e929b;
  --ac:#2f7bff;--acs:#1c3a78;--ok:#3cc47c;--wa:#e9a93b;--ko:#ea6a61;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding:12px 16px 120px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,select,textarea{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
textarea{min-height:120px;font:13px/1.35 ui-monospace,Menlo,monospace;resize:vertical}
h1{font-size:30px;line-height:1.1;margin:6px 0 16px;letter-spacing:-.02em}
h2{font-size:13px;font-weight:600;color:var(--mu);margin:26px 0 8px;letter-spacing:.01em}
h3{font-size:19px;margin:0 0 12px}
p{margin:0 0 8px}
.mu{color:var(--mu)}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.back{color:var(--ac);padding:10px 0;font-size:17px}
.ibtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:var(--s1);font-size:20px;text-align:center}
.btn{display:block;width:100%;text-align:center;background:var(--ac);color:#fff;font-weight:600;border-radius:14px;padding:15px 16px;font-size:17px}
.btn.sec{background:var(--s2);color:var(--tx)}
.btn.ghost{background:none;color:var(--mu);font-weight:500}
.btn.danger{background:#4a1f1d;color:#ffb3ad}
.btn + .btn{margin-top:10px}
.card{display:block;width:100%;background:var(--s1);border-radius:16px;padding:16px;margin-bottom:10px}
.day{display:flex;align-items:center;gap:12px}
.day .t{flex:1;min-width:0}
.day b{display:block;font-size:19px;font-weight:600}
.day small{color:var(--mu)}
.tag{font-size:12px;font-weight:600;border-radius:8px;padding:3px 8px;background:var(--acs);color:#b9d1ff;white-space:nowrap}
.tag.on{background:#1f4a35;color:#9ee6bd}
.banner{background:#33290f;color:#f1d596;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:15px}
.banner button{color:#ffd57a;font-weight:600;margin-top:4px;display:block}
.banner.err{background:#3a1f1d;color:#ffb8b2}
.seg{display:flex;background:var(--s1);border-radius:12px;padding:3px;margin:0 0 14px}
.seg button{flex:1;text-align:center;padding:9px 6px;border-radius:9px;color:var(--mu);font-weight:500}
.seg button.on{background:var(--s2);color:var(--tx)}
/* sesión */
.ent{background:var(--s1);border-radius:16px;margin-bottom:10px;overflow:hidden}
.eh{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px}
.eh-t{flex:1;min-width:0}
.eh-t b{display:block;font-size:17px;font-weight:600}
.eh-t small{color:var(--mu);font-size:14px}
.bdg{min-width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;background:var(--s2);color:var(--mu);padding:0 6px}
.bdg.up{background:#1f4a35;color:var(--ok)}
.bdg.down{background:#4a1f1d;color:var(--ko)}
.bdg.cap{background:#463413;color:var(--wa)}
.tick{width:22px;color:var(--ok);font-weight:700;text-align:center}
.eb{padding:0 16px 16px}
.sug{font-size:15px;color:#cfd2d9;margin-bottom:4px}
.sug.up{color:var(--ok)}.sug.down{color:var(--ko)}.sug.cap,.sug.warn{color:var(--wa)}
.last{font-size:14px;color:var(--mu)}
.note{font-size:14px;color:var(--wa);margin:4px 0}
.srow{display:grid;grid-template-columns:22px 1fr 1fr 48px;gap:8px;align-items:center;margin-top:8px}
.srow.k-time{grid-template-columns:22px 1fr auto 48px}
.srow.k-reps{grid-template-columns:22px 1fr 48px}
.srow.hd{margin-top:14px;font-size:12px;color:var(--mu)}
.srow.hd span{text-align:center}
.sn{color:var(--mu);font-size:14px;text-align:center}
.st{display:flex;align-items:center;background:var(--s2);border-radius:12px;overflow:hidden}
.st input{border:0;background:none;text-align:center;font-size:19px;font-weight:600;padding:10px 0;border-radius:0}
.sb{width:38px;height:44px;flex:none;text-align:center;font-size:20px;color:var(--mu)}
.chk{width:48px;height:44px;border-radius:12px;background:var(--s2);color:var(--mu);text-align:center;font-size:20px;font-weight:700}
.srow.done .chk{background:var(--ok);color:#06210f}
.srow.done .st{opacity:.65}
.tb{height:44px;padding:0 14px;border-radius:12px;background:var(--acs);color:#cfe0ff;font-weight:600;text-align:center;min-width:52px}
.tb.run{background:var(--ac);color:#fff}
.acts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px}
.acts button{color:var(--ac);font-size:15px;padding:6px 0}
.lumb{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lumb button{background:var(--s1);border-radius:12px;padding:12px 4px;text-align:center}
.lumb button b{display:block;font-size:20px}
.lumb button small{color:var(--mu);font-size:12px}
.lumb button.on{background:var(--acs);outline:2px solid var(--ac)}
/* listas */
.row{display:flex;align-items:center;gap:6px;background:var(--s1);border-radius:14px;padding:4px 4px 4px 14px;margin-bottom:8px}
.row .rmain{flex:1;min-width:0;padding:10px 0}
.row .rmain b{display:block;font-weight:600}
.row .rmain small{color:var(--mu)}
.mini{width:38px;height:40px;text-align:center;color:var(--mu);font-size:18px;flex:none}
.lbl{display:block;font-size:13px;color:var(--mu);margin:14px 0 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--s1);border-radius:14px;padding:14px 16px;margin-top:14px}
.sw input{width:24px;height:24px;accent-color:var(--ac)}
.stepper{display:flex;align-items:center;background:var(--s2);border-radius:12px;overflow:hidden;width:150px}
.stepper b{flex:1;text-align:center;font-size:19px}
.sum{display:flex;gap:10px;align-items:flex-start;background:var(--s1);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.sum div{flex:1;min-width:0}
.sum small{color:var(--mu);display:block}
details.ses{background:var(--s1);border-radius:14px;margin-bottom:8px}
details.ses summary{list-style:none;padding:14px;display:flex;align-items:center;gap:10px;cursor:pointer}
details.ses summary::-webkit-details-marker{display:none}
details.ses summary div{flex:1;min-width:0}
details.ses summary small{color:var(--mu);display:block}
.ses-b{padding:0 14px 14px;font-size:14px}
.ses-b p{margin:0 0 8px}
.ses-b span{color:var(--mu)}
.lc{font-size:12px;font-weight:600;border-radius:8px;padding:3px 8px;background:var(--s2);color:var(--mu);white-space:nowrap}
.lc.l1{background:#3b3416;color:#e8d27a}.lc.l2{background:#463413;color:var(--wa)}.lc.l3{background:#4a1f1d;color:var(--ko)}
.chart{background:var(--s1);border-radius:16px;padding:12px 8px 6px;margin-bottom:8px}
.chart svg{display:block;width:100%;height:auto}
/* tabs y modal */
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(27,28,32,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5;backdrop-filter:blur(12px)}
#tabs button{flex:1;text-align:center;padding:10px 0 8px;color:var(--mu);font-size:12px}
#tabs button.on{color:var(--ac)}
#tabs svg{display:block;margin:0 auto 3px;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.sheet{background:var(--s1);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.plist{max-height:34vh;overflow:auto;margin-bottom:12px}
.pi{display:block;width:100%;padding:13px 12px;border-bottom:1px solid var(--line)}
.newex{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px}
.newex select{grid-column:1/-1}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
.ver{text-align:center;color:var(--mu);font-size:12px;margin:30px 0 0}
.empty{text-align:center;padding:28px 8px;color:var(--mu)}
.empty .btn{margin-top:14px}
.goal{background:var(--acs);border-radius:18px;padding:16px;margin-bottom:14px;color:#e8f0ff}
.goal .big{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.1;color:#fff}
.goal small{display:block;color:#b9d1ff;font-size:13px;margin-top:8px}
.goal p{margin:0 0 10px}
.dn{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.dn b{font-size:17px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld span{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
.fld input{font-size:19px;font-weight:600}
input:disabled{opacity:.5}
.bal{background:var(--s1);border-radius:14px;padding:14px;margin-top:14px}
.bal .v{font-size:28px;font-weight:700}
.bal .v.ok{color:var(--ok)}.bal .v.wa{color:var(--wa)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv > span:first-child{color:var(--mu)}
.kv > span:last-child{text-align:right}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 12px}
.scale button{background:var(--s2);border-radius:10px;padding:11px 0;text-align:center;font-weight:600}
.scale button.on{background:var(--ac);color:#fff}
.warn-i{border-radius:12px;padding:11px 13px;margin-bottom:8px;font-size:15px;background:var(--s1)}
.warn-i.strong{background:#3a1f1d;color:#ffc2bc}.warn-i.soft{background:#33290f;color:#f1d596}.warn-i.ok{background:#17382a;color:#a6e8c5}
.cmp{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:6px 8px;font-size:14px;align-items:center}
.cmp .h{color:var(--mu);font-size:12px}
.cmp .r{text-align:right}
#rest{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--acs);color:#fff;border-radius:16px;padding:10px 12px 10px 18px;display:flex;align-items:center;gap:14px;z-index:6;max-width:536px;margin:0 auto;box-shadow:0 6px 24px rgba(0,0,0,.4)}
#rest[hidden]{display:none}
#rest span{color:#b9d1ff}
#rest b{font-size:28px;flex:1;font-variant-numeric:tabular-nums}
#rest button{background:var(--ac);border-radius:12px;padding:12px 18px;font-weight:600;text-align:center}
.bar{height:8px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:#fff;border-radius:6px}
.bar.over i{background:var(--wa)}
.goal .row2{display:flex;justify-content:space-between;gap:4px 14px;flex-wrap:wrap;font-size:15px;margin-top:10px}
.goal .gm{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:17px;margin-top:6px}
.gnote{font-size:13px;color:#ffd9a0;margin-top:6px}
.goal button{color:#b9d1ff;font-size:13px;margin-top:10px}
.fe{display:flex;align-items:center;gap:10px;background:var(--s1);border-radius:14px;padding:12px 14px;margin-bottom:8px;width:100%}
.fe .t{flex:1;min-width:0}
.fe .t b{display:block;font-weight:600}
.fe .t small{color:var(--mu);display:block}
.fe .n{text-align:right;font-size:13px;white-space:nowrap;color:var(--mu)}
.fe .n b{display:block;font-size:16px;color:var(--tx)}
.fe input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac);flex:none}
.ftag{font-size:11px;font-weight:600;border-radius:6px;padding:2px 6px;background:var(--s2);color:var(--mu);margin-left:6px}
.ftag.wa{background:#463413;color:var(--wa)}.ftag.ok{background:#1f4a35;color:var(--ok)}
.fpi{display:flex;align-items:center;gap:10px;width:100%;padding:12px 4px;border-bottom:1px solid var(--line)}
.fpi .t{flex:1;min-width:0}.fpi small{color:var(--mu);display:block}.fpi .st{color:var(--wa);font-size:18px}
.prev{background:var(--s2);border-radius:12px;padding:12px;margin:12px 0;font-size:15px}
.warn{background:#33290f;color:#f1d596;border-radius:12px;padding:10px 12px;font-size:14px}
.btn.small{padding:11px 14px;font-size:15px}
.seg button{font-size:14px}
.sheet .seg{background:var(--s2)}.sheet .seg button.on{background:var(--ac);color:#fff}
.ro{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:19px;font-weight:600;opacity:.85}
.scanbox{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;left:10%;right:10%;top:28%;bottom:28%;border:2px solid rgba(255,255,255,.9);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="tabs">
  <button data-act="tab" data-to="cuerpo"><svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="2.5"/><path d="M5 21l2-9h10l2 9"/><path d="M8 12l1-3h6l1 3"/></svg>Cuerpo</button>
  <button data-act="tab" data-to="comida"><svg viewBox="0 0 24 24"><path d="M7 3v7M4 3v5a3 3 0 0 0 6 0V3M7 10v11"/><path d="M17 3c-2 1-3 4-3 7h3v11"/></svg>Comida</button>
  <button data-act="tab" data-to="hoy"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>Entreno</button>
  <button data-act="tab" data-to="progreso"><svg viewBox="0 0 24 24"><path d="M3 18l6-6 4 4 8-9"/><path d="M15 7h6v6"/></svg>Progreso</button>
  <button data-act="tab" data-to="rutina"><svg viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Rutina</button>
</nav>
<div id="modal" hidden></div>
<div id="toast"></div>
<div id="rest" hidden><span>Descanso</span><b id="rest-t">1:00</b><button data-act="rskip">Saltar</button></div>

<script>
(function(){
'use strict';

/* ---------- utilidades ---------- */
var APP_VERSION='0.6';
var KEY='gymlog.v1', DAY=864e5;
var $app=document.getElementById('app'), $tabs=document.getElementById('tabs'),
    $modal=document.getElementById('modal'), $toast=document.getElementById('toast');
var storageOK=true;
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtN(n){return (n==null||n==='')?'':String(Math.round(n*100)/100).replace('.',',');}
function parseN(v){var n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null;}
function fmtT(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function dFmt(ts){return new Date(ts).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});}
function dShort(ts){var d=new Date(ts);return d.getDate()+'/'+(d.getMonth()+1);}
function ago(ts){var n=Math.floor((Date.now()-ts)/DAY);return n<=0?'hoy':n===1?'ayer':'hace '+n+' días';}
function plural(n,a,b){return n+' '+(n===1?a:b);}

/* ---------- estado ---------- */
function blank(){return {version:3,exercises:{},days:[],sessions:[],current:null,lastExport:null,body:null,food:null};}
function load(){
  try{var t=localStorage.getItem(KEY);if(t){var o=JSON.parse(t);return Object.assign(blank(),o);}}catch(e){storageOK=false;}
  return blank();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOK=false;}}
var S=load();
var ui={screen:'hoy',open:0,id:null,dayId:null,seg:'ex',metric:0,out:'',msg:null,summary:null,fpicked:{},fsel:false};
var tm=null, wl=null, modalH={};

/* ---------- ejercicios, historial y progresión ---------- */
function newEx(name,type){
  type=type||'weight';
  return {id:uid(),name:name,type:type,sets:3,
    min:type==='time'?30:type==='reps'?8:6, max:type==='time'?45:type==='reps'?12:8,
    step:type==='weight'?2.5:type==='time'?5:1, back:false, note:'', rest:60};
}
function hist(exId){
  var out=[];
  S.sessions.forEach(function(s){s.entries.forEach(function(e){
    if(e.exId===exId){
      var sets=e.sets.filter(function(x){return x.r>0;});
      if(sets.length) out.push({date:s.date,disc:s.discomfort,sets:sets});
    }});});
  return out;
}
function score(ex,h){
  return h.sets.reduce(function(a,s){return a+(ex.type==='weight'?(s.w||0)*s.r:s.r);},0);
}
function fmtSet(ex,s){return ex.type==='weight'?fmtN(s.w)+'×'+s.r:ex.type==='time'?s.r+' s':String(s.r);}

function suggest(ex){
  var H=hist(ex.id), n=ex.sets, isW=ex.type==='weight', i;
  var L=H[H.length-1];
  if(!L){
    var sets0=[];for(i=0;i<n;i++)sets0.push({w:null,r:ex.min});
    return {kind:'new',msg:isW?'Primera vez: anota tus pesos.':'Primera vez.',sets:sets0,last:null,stalled:false};
  }
  var P=H[H.length-2], lastSet=L.sets[L.sets.length-1];
  function get(k){return L.sets[k]||lastSet;}
  var inc=ex.type==='time'?ex.step:1;
  var stalled=false;
  if(H.length>=4){
    var sc=H.slice(-4).map(function(h){return score(ex,h);});
    stalled=sc[3]<=sc[2]&&sc[2]<=sc[1]&&sc[1]<=sc[0];
  }
  var allMax=L.sets.length>=n&&L.sets.every(function(s){return s.r>=ex.max;});
  var raised=!!(isW&&P&&L.sets.some(function(s,k){var p=P.sets[k]||P.sets[P.sets.length-1];return s.w>p.w;}));
  var out=[], kind, msg;
  if(allMax){
    if(ex.back&&(L.disc||0)>=2){
      kind='hold';msg='Mantén el peso: molestia lumbar '+L.disc+' la última vez.';
      for(i=0;i<n;i++)out.push({w:isW?get(i).w:null,r:ex.max});
    }else if(isW){
      kind='up';msg='Sube '+fmtN(ex.step)+' kg en todas las series. Objetivo: '+ex.min+' reps.';
      for(i=0;i<n;i++)out.push({w:Math.round((get(i).w+ex.step)*100)/100,r:ex.min});
    }else{
      kind='cap';msg=ex.type==='time'?'Tope alcanzado en todas. Sube el rango o dificulta el ejercicio.':'Tope alcanzado en todas. Añade lastre o pasa a una variante más difícil.';
      for(i=0;i<n;i++)out.push({w:null,r:ex.max});
    }
  }else{
    var anyDown=false, anyBelow=false;
    for(i=0;i<n;i++){
      var s=get(i), below=s.r<ex.min, w=isW?s.w:null, r;
      if(below){
        anyBelow=true;
        if(isW&&!raised){w=Math.max(0,Math.round((s.w-ex.step)*100)/100);anyDown=true;}
        r=ex.min;
      }else r=s.r>=ex.max?ex.max:Math.min(ex.max,s.r+inc);
      out.push({w:w,r:r});
    }
    if(anyDown){kind='down';msg='Baja '+fmtN(ex.step)+' kg en las series que quedaron por debajo de '+ex.min+' reps.';}
    else if(anyBelow&&raised){kind='hold';msg='Mantén el peso: primera sesión tras subir.';}
    else{kind='hold';msg=isW||ex.type==='reps'?'Mismo peso. +1 rep en las series que no llegaron al tope ('+ex.max+').':'Sube '+ex.step+' s en las series que no llegaron al tope ('+ex.max+' s).';
      if(!isW&&ex.type==='reps')msg='+1 rep en las series que no llegaron al tope ('+ex.max+').';}
  }
  return {kind:kind,msg:msg,sets:out,last:L,stalled:stalled};
}
var BADGE={up:'↑',hold:'=',down:'↓',cap:'◆'};

/* ---------- sesión ---------- */
function mkEntry(exId){
  var ex=S.exercises[exId], sg=suggest(ex);
  return {exId:exId,replaces:null,sets:sg.sets.map(function(s){return {w:s.w,r:s.r,done:false};})};
}
function entryDone(e){return e.sets.length>0&&e.sets.every(function(s){return s.done;});}
function startSession(dayId){
  var d=S.days.find(function(x){return x.id===dayId;});
  var entries=d.exIds.filter(function(id){return S.exercises[id];}).map(mkEntry);
  stopRest();
  S.current={id:uid(),dayId:d.id,dayName:d.name,started:Date.now(),discomfort:null,entries:entries};
  ui.open=0;save();go('sesion');
}
function finishSession(){
  var c=S.current;
  var entries=c.entries.map(function(e){return {exId:e.exId,replaces:e.replaces||null,
    sets:e.sets.filter(function(s){return s.done;}).map(function(s){return {w:s.w,r:s.r};})};
  }).filter(function(e){return e.sets.length;});
  if(!entries.length){toast('Marca al menos una serie');return;}
  S.sessions.push({id:c.id,dayId:c.dayId,dayName:c.dayName,date:Date.now(),discomfort:c.discomfort==null?null:c.discomfort,entries:entries});
  S.current=null;stopTimerSilently();stopRest();
  var tk=dkey(Date.now()),br=S.body.days[tk];
  if(!(br&&br.closed)){br=ensureDay(tk);br.trained=true;}
  save();
  ui.summary=entries.map(function(e){var ex=S.exercises[e.exId],sg=suggest(ex);return {name:ex.name,kind:sg.kind,msg:sg.msg,stalled:sg.stalled};});
  go('resumen');
}

/* ---------- cronómetro ---------- */
function lock(){try{if(navigator.wakeLock){navigator.wakeLock.request('screen').then(function(l){wl=l;}).catch(function(){});}}catch(e){}}
function unlock(){try{if(wl)wl.release();}catch(e){}wl=null;}
function stopTimerSilently(){tm=null;idleUnlock();}
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
/* descanso entre series */
var rt=null;
function restOf(ex){return ex.rest==null?60:ex.rest;}
function idleUnlock(){if(!tm&&!rt)unlock();}
function restTick(){var el=document.getElementById('rest-t');if(!el||!rt)return;el.textContent=fmtT(Math.max(0,Math.ceil(rt.dur-(Date.now()-rt.t0)/1000)));}
function restBar(){var el=document.getElementById('rest');if(!el)return;var show=!!rt&&ui.screen==='sesion';el.hidden=!show;if(show)restTick();}
function stopRest(){rt=null;idleUnlock();restBar();}
function startRest(e){
  var ex=S.exercises[e.exId],d=ex?restOf(ex):0;
  if(!ex||d<=0||entryDone(e)){if(rt)stopRest();return;}
  rt={t0:Date.now(),dur:d};lock();restBar();
}
setInterval(function(){
  if(rt){if(rt.dur-(Date.now()-rt.t0)/1000<=0){stopRest();vib([200,100,200]);toast('Descanso terminado');}else restTick();}
  if(!tm||!S.current)return;
  var sec=Math.floor((Date.now()-tm.t0)/1000);
  var el=document.querySelector('[data-tmr]');if(el)el.textContent=fmtT(sec);
  var e=S.current.entries[tm.ei];if(!e)return;var ex=S.exercises[e.exId];
  if(!tm.vMin&&sec>=ex.min){tm.vMin=true;vib(80);}
  if(!tm.vMax&&sec>=ex.max){tm.vMax=true;vib([80,60,80]);}
},250);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&(tm||rt))lock();});

  var H=hist(ex.id);if(!H.length)return null;
  var L=H[H.length-1], P=H[H.length-2];
  var trend=P?(score(ex,L)>score(ex,P)?'↑':score(ex,L)<score(ex,P)?'↓':'='):'';
  return {H:H,L:L,trend:trend};
}

      });

function chartSvg(vals,dates,unit){
  var W=340,H=150,pl=40,pr=12,pt=14,pb=24;
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  if(mn===mx){mn-=1;mx+=1;}
  var pad=(mx-mn)*0.1;mn-=pad;mx+=pad;
  function X(i){return pl+(vals.length===1?0:i*(W-pl-pr)/(vals.length-1));}
  function Y(v){return pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));}
  var pts=vals.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1);}).join(' ');
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfica de progreso">';
  s+='<line x1="'+pl+'" y1="'+Y(mn+pad)+'" x2="'+(W-pr)+'" y2="'+Y(mn+pad)+'" stroke="var(--line)"/><line x1="'+pl+'" y1="'+Y(mx-pad)+'" x2="'+(W-pr)+'" y2="'+Y(mx-pad)+'" stroke="var(--line)"/>';
  s+='<text x="'+(pl-6)+'" y="'+(Y(mx-pad)+4)+'" fill="var(--mu)" font-size="11" text-anchor="end">'+fmtN(Math.round((mx-pad)*10)/10)+'</text>';
  s+='<text x="'+(pl-6)+'" y="'+(Y(mn+pad)+4)+'" fill="var(--mu)" font-size="11" text-anchor="end">'+fmtN(Math.round((mn+pad)*10)/10)+'</text>';
  s+='<polyline points="'+pts+'" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  vals.forEach(function(v,i){s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="3.5" fill="var(--ac)"/>';});
  s+='<text x="'+pl+'" y="'+(H-6)+'" fill="var(--mu)" font-size="11">'+dShort(dates[0])+'</text>';
  if(vals.length>1)s+='<text x="'+(W-pr)+'" y="'+(H-6)+'" fill="var(--mu)" font-size="11" text-anchor="end">'+dShort(dates[dates.length-1])+'</text>';
  return s+'</svg>';
}
function vProgEx(){
  var ex=S.exercises[ui.id], st=ex&&exStats(ex);
  if(!st)return '<button class="back" data-act="go" data-to="progreso">‹ Progreso</button><div class="empty">Sin datos todavía.</div>';
  var names=ex.type==='weight'?['Peso máximo','Volumen']:ex.type==='time'?['Mejor tiempo','Total']:['Mejor serie','Reps totales'];
  var unit=ex.type==='weight'?' kg':ex.type==='time'?' s':'';

  var vals=st.H.map(fn), dates=st.H.map(function(h){return h.date;});

/* ---------- exportar / importar ---------- */
function buildExport(kind){
  var base={app:'gymlog',version:3,kind:kind,exported:new Date().toISOString()};
  if(kind==='routine'){
    base.days=S.days.map(function(d){return {id:d.id,name:d.name,exercises:d.exIds.filter(function(i){return S.exercises[i];}).map(function(i){return S.exercises[i];})};});
  }else if(kind==='progress'){base.exercises=S.exercises;base.sessions=S.sessions;base.body=S.body;base.food=S.food;}
  else{base.exercises=S.exercises;base.days=S.days;base.sessions=S.sessions;base.body=S.body;base.food=S.food;}
  return base;
}
function doExport(kind){
  var json=JSON.stringify(buildExport(kind),null,1);
  var name='gymlog-'+kind+'-'+new Date().toISOString().slice(0,10)+'.json';
  function fallback(){ui.out=json;render(true);}
  function mark(){if(kind!=='routine'){S.lastExport=Date.now();save();}}
  if(window.claude&&window.claude.use){
    window.claude.use('downloads').then(function(dl){
      if(!dl){fallback();return null;}
      return dl.save({filename:name,data:json}).then(function(){mark();ui.msg={t:'Copia guardada.'};render(true);},
        function(e){if(e&&e.code==='declined')return;fallback();});
    }).catch(fallback);
  }else{
    var done=function(){mark();ui.msg={t:'Copia guardada.'};render(true);};
    var blobSave=function(){
      try{
        var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;
        document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);done();
      }catch(e){fallback();}
    };
    var file=null;
    try{file=new File([json],name,{type:'application/json'});}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:name}).then(done,function(e){if(!e||e.name!=='AbortError')blobSave();});
    }else blobSave();
  }
}
function num(v,d){var n=parseN(v);return n==null?d:n;}
function normEx(x){
  var type=['weight','time','reps'].indexOf(x.type)>=0?x.type:'weight';
  var min=num(x.min,type==='time'?30:6), max=num(x.max,type==='time'?45:8);if(max<min)max=min;
  return {name:String(x.name).trim(),type:type,sets:Math.max(1,Math.round(num(x.sets,3))),min:min,max:max,
    step:num(x.step,type==='weight'?2.5:type==='time'?5:1),back:!!x.back,note:x.note?String(x.note):'',rest:Math.max(0,Math.round(num(x.rest,60)))};
}
function validateRoutine(o){
  if(!Array.isArray(o.days))throw new Error('Falta la lista «days».');
  o.days.forEach(function(d,i){
    if(!d||typeof d.name!=='string'||!d.name.trim())throw new Error('El día '+(i+1)+' no tiene nombre.');
    if(!Array.isArray(d.exercises))throw new Error('El día «'+d.name+'» no tiene lista «exercises».');
    d.exercises.forEach(function(x,j){if(!x||typeof x.name!=='string'||!x.name.trim())throw new Error('Un ejercicio del día «'+d.name+'» no tiene nombre (posición '+(j+1)+').');});
  });
}
function applyRoutine(o,mode){
  var byName={};Object.keys(S.exercises).forEach(function(k){byName[S.exercises[k].name.toLowerCase()]=k;});
  var seen={}, nd=[];
  o.days.forEach(function(d){
    var ids=[];
    d.exercises.forEach(function(x){
      var key=x.name.trim().toLowerCase();
      var id=(x.id&&S.exercises[x.id])?x.id:(seen[key]||byName[key]||x.id||uid());
      seen[key]=id;
      S.exercises[id]=Object.assign({id:id},normEx(x));
      if(ids.indexOf(id)<0)ids.push(id);
    });
    var did=d.id&&(mode==='replace'||!S.days.some(function(z){return z.id===d.id;}))?d.id:uid();
    nd.push({id:did,name:d.name.trim(),exIds:ids});
  });
  S.days=mode==='replace'?nd:S.days.concat(nd);
  save();
}
function importText(text){
  var o;
  try{o=JSON.parse(text);}catch(e){ui.msg={err:1,t:'El texto no es un JSON válido. No se ha cambiado nada.'};render(true);return;}
  try{
    if(!o||typeof o!=='object')throw new Error('El archivo no tiene el formato esperado.');
    var kind=o.kind||(o.sessions?(o.days?'all':'progress'):'routine');
    if(kind==='routine'){
      validateRoutine(o);
      modal('<h3>Importar rutina</h3><p class="mu">'+plural(o.days.length,'día','días')+' en el archivo. ¿Qué hago con tu rutina actual?</p>'+
        '<button class="btn" data-m="add">Añadir a la actual</button><button class="btn sec" data-m="rep">Reemplazarla</button><button class="btn ghost" data-m="no">Cancelar</button>',
        {add:function(){closeModal();applyRoutine(o,'add');ui.msg={t:'Rutina añadida.'};render(true);},
         rep:function(){closeModal();applyRoutine(o,'replace');ui.msg={t:'Rutina reemplazada. Tu progreso sigue intacto.'};render(true);},
         no:closeModal});
    }else if(kind==='progress'||kind==='all'){
      if(!o.exercises||typeof o.exercises!=='object'||!Array.isArray(o.sessions))throw new Error('Faltan «exercises» o «sessions».');
      if(kind==='all'&&!Array.isArray(o.days))throw new Error('Falta la lista «days».');
      if(o.body!=null&&(typeof o.body!=='object'||(o.body.days!=null&&(typeof o.body.days!=='object'||Array.isArray(o.body.days)))||(o.body.weeks!=null&&!Array.isArray(o.body.weeks))))throw new Error('El bloque «body» no tiene el formato esperado.');
      if(o.food!=null&&(typeof o.food!=='object'||(o.food.foods!=null&&!Array.isArray(o.food.foods))||(o.food.recipes!=null&&!Array.isArray(o.food.recipes))||(o.food.log!=null&&(typeof o.food.log!=='object'||Array.isArray(o.food.log)))))throw new Error('El bloque «food» no tiene el formato esperado.');
      if(kind==='all'){
        ask('Restaurar copia completa','Esto reemplaza toda tu rutina y tu progreso actuales.','Restaurar',function(){
          S=Object.assign(blank(),{exercises:o.exercises,days:o.days,sessions:o.sessions.slice().sort(function(a,b){return a.date-b.date;}),lastExport:Date.now(),body:normBody(o.body),food:normFood(o.food)});
          save();ui.msg={t:'Copia restaurada.'};render(true);});
      }else{
        var have={};S.sessions.forEach(function(s){have[s.id]=1;});
        var add=o.sessions.filter(function(s){return !have[s.id];});
        Object.keys(o.exercises).forEach(function(k){if(!S.exercises[k])S.exercises[k]=o.exercises[k];});
        S.sessions=S.sessions.concat(add).sort(function(a,b){return a.date-b.date;});
        if(o.body){var nb=normBody(o.body);
          Object.keys(nb.days).forEach(function(k){if(!S.body.days[k])S.body.days[k]=nb.days[k];});
          nb.weeks.forEach(function(w){if(!S.body.weeks.some(function(x){return x.id===w.id;}))S.body.weeks.push(w);});
          S.body.weeks.sort(function(a,b){return a.closedAt-b.closedAt;});
          if(!S.body.cfg.birth&&S.body.cfg.height==null)S.body.cfg=nb.cfg;}
        if(o.food){var nf=normFood(o.food);
          nf.foods.forEach(function(x){if(!getFood(x.id))S.food.foods.push(x);});
          nf.recipes.forEach(function(x){if(!getRec(x.id))S.food.recipes.push(x);});
          Object.keys(nf.log).forEach(function(k){if(!S.food.log[k])S.food.log[k]=nf.log[k];});}
        save();ui.msg={t:'Progreso importado: '+plural(add.length,'sesión nueva','sesiones nuevas')+'.'};render(true);
      }
    }else throw new Error('Tipo de archivo desconocido: '+kind);
  }catch(e){ui.msg={err:1,t:e.message+' No se ha cambiado nada.'};render(true);}
}

/* ---------- cuerpo: peso, actividad y balance ---------- */
var PH={
  deficit:{label:'Déficit',margin:-400,prot:2.1,lo:-0.9,hi:-0.2},
  mantenimiento:{label:'Mantenimiento',margin:0,prot:1.9,lo:-0.2,hi:0.2},
  volumen:{label:'Volumen',margin:300,prot:1.9,lo:0.2,hi:0.4}
};
function cfgDefaults(){return {birth:null,height:null,phase:'deficit',stepsGoal:10000,refs:[null,null,null]};}
function dkey(t){var d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function kdate(k){return new Date(k+'T12:00:00');}
function kLabel(k){return kdate(k).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});}
function kShort(k){var d=kdate(k);return d.getDate()+'/'+(d.getMonth()+1);}
function ageAt(birth,k){var b=kdate(birth),d=kdate(k),a=d.getFullYear()-b.getFullYear(),m=d.getMonth()-b.getMonth();if(m<0||(m===0&&d.getDate()<b.getDate()))a--;return a;}
function r10(n){return Math.round(n/10)*10;}
function sgn(n,dec){var v=Math.round(n*Math.pow(10,dec))/Math.pow(10,dec);return (v>0?'+':v<0?'−':'')+fmtN(Math.abs(v));}
function avg(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:null;}
function freeze(r,cfg){
  cfg=cfg||S.body.cfg;
  if(r.age==null&&cfg.birth)r.age=ageAt(cfg.birth,r.date);
  if(r.height==null&&cfg.height!=null)r.height=cfg.height;
}
function normBody(b){
  b=b&&typeof b==='object'?b:{};
  var cfg=Object.assign(cfgDefaults(),b.cfg||{});
  if(!PH[cfg.phase])cfg.phase='deficit';
  if(!Array.isArray(cfg.refs))cfg.refs=[null,null,null];
  cfg.refs=cfg.refs.slice(0,3);while(cfg.refs.length<3)cfg.refs.push(null);
  var days=b.days&&typeof b.days==='object'&&!Array.isArray(b.days)?b.days:{};
  var weeks=Array.isArray(b.weeks)?b.weeks:[];
  Object.keys(days).forEach(function(k){var r=days[k];r.date=r.date||k;freeze(r,cfg);});
  return {cfg:cfg,days:days,weeks:weeks};
}
function ensureDay(k){var r=S.body.days[k];if(!r){r=S.body.days[k]={date:k};}freeze(r);return r;}
function hasData(r){return r.weight!=null||r.steps!=null||r.kcal!=null||r.prot!=null||r.free||r.trained===true||r.energy!=null||r.sleep!=null||!!foodTot(r.date);}
function gv(r,f){var t=foodTot(r.date);if(f==='kcal')return t?t.kcal:r.kcal;if(f==='prot')return t?t.prot:r.prot;if(f==='carb')return t?t.carb:null;if(f==='fat')return t?t.fat:null;return r[f];}
function sessionsOn(k){return S.sessions.some(function(s){return dkey(s.date)===k;});}
function trainedEff(k){var r=S.body.days[k];if(r&&r.trained===true)return true;if(r&&r.trained===false)return false;return sessionsOn(k);}
function bal(r){
  if(!r)return {v:null,why:'sin registro'};
  if(r.free)return {v:null,why:'día libre'};
  if(r.weight==null)return {v:null,why:'falta el peso'};
  var kc=gv(r,'kcal');if(kc==null)return {v:null,why:'faltan las kcal'};
  if(r.age==null||r.height==null)return {v:null,why:'faltan altura o fecha de nacimiento en la configuración'};
  var bmr=10*r.weight+6.25*r.height-5*r.age+5, st=(r.steps||0)*0.045, tr=trainedEff(r.date)?250:0, tot=bmr+st+tr;
  return {v:kc-tot,bmr:bmr,steps:st,tr:tr,total:tot,kcal:kc,why:null};
}
function lastWeight(){var best=null;Object.keys(S.body.days).forEach(function(k){var r=S.body.days[k];if(r.weight!=null&&(!best||k>best.k))best={k:k,w:r.weight};});return best;}
function lastWeightOn(k){var best=null;Object.keys(S.body.days).forEach(function(d){var r=S.body.days[d];if(r.weight!=null&&d<=k&&(!best||d>best.k))best={k:d,w:r.weight};});return best;}
function goalFor(k){
  var c=S.body.cfg,r=S.body.days[k];
  var age=r&&r.age!=null?r.age:(c.birth?ageAt(c.birth,k):null),hgt=r&&r.height!=null?r.height:c.height;
  if(age==null||hgt==null)return {why:'cfg'};
  var lw=lastWeightOn(k);if(!lw)return {why:'weight'};
  var ph=PH[c.phase],bmr=10*lw.w+6.25*hgt-5*age+5,st=c.stepsGoal*0.045,tr=trainedEff(k)?250:0,g=bmr+st+tr;
  var kcal=g+ph.margin,prot=lw.w*ph.prot,fat=lw.w*1,carb=(kcal-4*prot-9*fat)/4;
  return {kcal:kcal,prot:prot,fat:fat,carb:carb,gasto:g,w:lw.w,wk:lw.k,ph:ph};
}
function goalCalc(){return goalFor(dkey(Date.now()));}
function goalHtml(){
  var g=goalCalc();
  if(g.why==='cfg')return '<p>Completa tu fecha de nacimiento y tu altura para ver el objetivo de hoy.</p><button class="btn sec" data-act="go" data-to="cuerpo_cfg">Abrir configuración</button>';
  if(g.why==='weight')return '<p>Registra tu primer peso y aquí verás el objetivo de hoy.</p>';
  return '<div>Objetivo de hoy</div><div class="big">≈ '+r10(g.kcal)+' kcal</div><div class="gm"><span>Proteína ≈ '+Math.round(g.prot/5)*5+' g</span><span>Grasas ≈ '+Math.round(g.fat/5)*5+' g</span>'+(g.carb>0?'<span>Hidratos ≈ '+Math.round(g.carb/5)*5+' g</span>':'')+'</div>'+
    (g.carb<=0?'<div class="gnote">No queda margen para hidratos con estas kcal.</div>':g.carb<50?'<div class="gnote">Quedan pocos hidratos para tu objetivo de kcal.</div>':'')+
    '<small>Fase '+g.ph.label.toLowerCase()+': gasto estimado ≈ '+r10(g.gasto)+' kcal'+(g.ph.margin?' '+sgn(g.ph.margin,0)+' kcal':'')+'. Peso usado: '+fmtN(g.w)+' kg ('+kShort(g.wk)+'). Cifras orientativas.</small>';
}
function goalLine(k){
  var g=goalFor(k),today=dkey(Date.now());
  if(g.why)return '<div class="mu" style="font-size:14px;margin-bottom:10px">Objetivo de kcal: aparece al completar la configuración y registrar un peso.</div>';
  return '<div class="kv" style="padding-top:0"><span>'+(k===today?'Objetivo de hoy':'Objetivo de ese día')+' ('+g.ph.label+')</span><span><b>≈ '+r10(g.kcal)+' kcal</b></span></div>';
}
function balHtml(k){
  var r=S.body.days[k],b=bal(r);
  if(b.v==null)return goalLine(k)+'<div class="mu" style="margin-top:10px">Balance estimado: sin cálculo ('+esc(b.why)+').</div>';
  var ph=S.body.cfg.phase,good=ph==='deficit'?b.v<0:ph==='volumen'?b.v>0:Math.abs(b.v)<=150;
  var h=goalLine(k)+'<div class="mu" style="margin-top:10px">Balance estimado</div><div class="v '+(good?'ok':'wa')+'">≈ '+sgn(r10(b.v),0)+' kcal</div><div class="mu" style="font-size:13px">'+(b.v<0?'Déficit':'Superávit')+' orientativo, con un margen real de ±300–400 kcal.</div>';

  }

/* medias y cierre semanal */
function rmIn(id,from,to){
  var best=null;
  S.sessions.forEach(function(s){var k=dkey(s.date);if(k<from||k>to)return;
    s.entries.forEach(function(e){if(e.exId!==id)return;var m=0;
      e.sets.forEach(function(x){if(x.w!=null&&x.r>0)m=Math.max(m,x.w*(1+x.r/30));});
      if(m>0&&(!best||s.date>=best.t))best={t:s.date,v:m};});});
  return best?Math.round(best.v*10)/10:null;
}
function pendingRecs(){
  return Object.keys(S.body.days).map(function(k){return S.body.days[k];}).filter(function(r){return !r.closed&&hasData(r);})
    .sort(function(a,b){return a.date<b.date?-1:1;});
}
function weekStats(recs){
  var from=recs[0].date,to=recs[recs.length-1].date,cfg=S.body.cfg;
  var total=Math.round((kdate(to)-kdate(from))/DAY)+1;
  function col(f,free){return recs.filter(function(r){return gv(r,f)!=null&&!(free&&r.free);}).map(function(r){return gv(r,f);});}
  var W=col('weight'),ST=col('steps'),KC=col('kcal',1),PR=col('prot',1),CB=col('carb',1),FT=col('fat',1),EN=col('energy'),SL=col('sleep');
  var BL=recs.map(function(r){return bal(r).v;}).filter(function(v){return v!=null;});
  var ses=S.sessions.filter(function(s){var k=dkey(s.date);return k>=from&&k<=to;});
  var LU=ses.filter(function(s){return s.discomfort!=null;}).map(function(s){return s.discomfort;});
  var dset={};recs.forEach(function(r){dset[r.date]=1;});ses.forEach(function(s){dset[dkey(s.date)]=1;});
  var trained=Object.keys(dset).filter(trainedEff).length;
  var rm={};cfg.refs.forEach(function(id){if(!id||!S.exercises[id]||rm[id])return;var v=rmIn(id,from,to);if(v!=null)rm[id]={name:S.exercises[id].name,v:v};});
  return {from:from,to:to,total:total,phase:cfg.phase,
    nW:W.length,avgWeight:avg(W),nSteps:ST.length,avgSteps:avg(ST),nKcal:KC.length,avgKcal:avg(KC),nProt:PR.length,avgProt:avg(PR),nCarb:CB.length,avgCarb:avg(CB),nFat:FT.length,avgFat:avg(FT),
    nBal:BL.length,avgBal:avg(BL),nEn:EN.length,avgEnergy:avg(EN),nSl:SL.length,avgSleep:avg(SL),nLu:LU.length,avgLumbar:avg(LU),
    trained:trained,free:recs.filter(function(r){return r.free;}).length,rm:rm};
}

  var s=weekStats(recs);

  function val(v,dec,u){return v==null?'—':fmtN(Math.round(v*Math.pow(10,dec))/Math.pow(10,dec)).replace('-','−')+(u?' '+u:'');}
  var h='<h3>Cerrar semana</h3><p class="mu">Del '+kShort(s.from)+' al '+kShort(s.to)+' ('+plural(s.total,'día','días')+').'+(s.total>7?' Son más de siete días: revisa que no arrastres días antiguos.':'')+'</p>'+
    row('Peso medio',val(s.avgWeight,1,'kg'),s.nW)+row('Pasos medios',val(s.avgSteps,0),s.nSteps)+row('Kcal media',val(s.avgKcal,0),s.nKcal)+
    row('Proteína media',val(s.avgProt,0,'g'),s.nProt)+row('Hidratos medios',val(s.avgCarb,0,'g'),s.nCarb)+row('Grasas medias',val(s.avgFat,0,'g'),s.nFat)+row('Balance medio',s.avgBal==null?'—':'≈ '+sgn(r10(s.avgBal),0)+' kcal',s.nBal);
  Object.keys(s.rm).forEach(function(id){h+=row('1RM est. '+esc(s.rm[id].name),fmtN(s.rm[id].v)+' kg');});
  h+=row('Días entrenados',String(s.trained))+row('Días libres',String(s.free))+row('Molestia lumbar media',val(s.avgLumbar,1),s.nLu)+row('Energía',val(s.avgEnergy,1),s.nEn)+row('Sueño',val(s.avgSleep,1),s.nSl);
  h+='<p class="mu" style="font-size:13px;margin-top:10px">Al cerrar, estas medias quedan fijas. Si editas después uno de estos días, no se actualizarán.</p><button class="btn" data-m="ok">Confirmar cierre</button><button class="btn ghost" data-m="no">Cancelar</button>';

/* comparativa y avisos */
function weekWarnings(p,l){
  var out=[],cfg=S.body.cfg,ph=PH[l.phase]||PH[cfg.phase],dW=(p.avgWeight!=null&&l.avgWeight!=null)?l.avgWeight-p.avgWeight:null;
  if(dW!=null){
    var range=l.phase==='mantenimiento'?'±0,2':sgn(ph.lo,1)+' a '+sgn(ph.hi,1),txt=sgn(dW,2)+' kg/semana';
    if(dW>=ph.lo&&dW<=ph.hi)out.push({lvl:'ok',t:'Ritmo de peso '+txt+': dentro del objetivo ('+range+').'});
    else if(l.phase==='mantenimiento'){
      out.push({lvl:Math.abs(dW)>0.5?'strong':'soft',t:'Tu peso se aleja del mantenimiento ('+txt+'). '+(Math.abs(dW)>0.5?'Considera ajustar unas 150–200 kcal '+(dW>0?'a la baja.':'al alza.'):'')});
    }else{
      var slow=l.phase==='deficit'?dW>ph.hi:dW<ph.lo;
      if(slow)out.push({lvl:'soft',t:'El peso cambia más despacio de lo previsto para tu fase ('+txt+'; objetivo '+range+').'});
      else out.push({lvl:'strong',t:'El peso cambia demasiado rápido ('+txt+'; objetivo '+range+'). Considera ajustar unas 150–200 kcal '+(l.phase==='deficit'?'al alza.':'a la baja.')});
    }
  }
  if(p.avgSteps!=null&&l.avgSteps!=null&&Math.abs(l.avgSteps-p.avgSteps)>2000)out.push({lvl:'info',t:'Los pasos medios cambiaron en '+sgn(Math.round(l.avgSteps-p.avgSteps),0)+' respecto a la semana anterior.'});
  if(l.phase!=='mantenimiento'&&dW!=null&&l.avgBal!=null&&Math.abs(l.avgBal)>=50&&Math.abs(dW)>=0.1){
    var b=l.avgBal;
    if(l.phase==='deficit'&&b>0&&dW<0)out.push({lvl:'info',t:'El balance estimado sugiere superávit, pero el peso bajó. Probablemente el modelo subestima tu gasto real. No es un error: no te fíes ciegamente de la cifra.'});
    if(l.phase==='deficit'&&b<0&&dW>0)out.push({lvl:'info',t:'El balance estimado sugiere déficit, pero el peso subió. Puede haber retención de líquidos, comidas sin contar o un gasto real menor que el estimado.'});
    if(l.phase==='volumen'&&b<0&&dW>0)out.push({lvl:'info',t:'El balance estimado sugiere déficit, pero el peso subió. Probablemente el modelo subestima tu gasto o falta comida por registrar.'});
    if(l.phase==='volumen'&&b>0&&dW<0)out.push({lvl:'info',t:'El balance estimado sugiere superávit, pero el peso bajó. Probablemente el gasto real es mayor que el estimado.'});
  }
  if(l.nKcal<l.total)out.push({lvl:'info',t:'Solo hay comida registrada en '+l.nKcal+' de '+l.total+' días: la media de kcal puede no ser representativa.'});
  var pw=l.avgWeight!=null?l.avgWeight:(lastWeight()||{}).w;
  if(l.avgProt!=null&&pw!=null){var tp=pw*ph.prot;if(l.avgProt<tp*0.9)out.push({lvl:'soft',t:'Proteína media de '+Math.round(l.avgProt)+' g, por debajo del objetivo de tu fase (≈ '+Math.round(tp/5)*5+' g).'});}
  var ids=Object.keys(l.rm||{}).filter(function(id){return p.rm&&p.rm[id];});
  if(ids.length&&ids.every(function(id){return l.rm[id].v<p.rm[id].v;}))out.push({lvl:'strong',t:'La fuerza baja en todos tus ejercicios de referencia ('+ids.map(function(id){return l.rm[id].name;}).join(', ')+'). Es mala señal en cualquier fase.'});
  var ord={strong:0,soft:1,info:2,ok:3};
  return out.sort(function(a,b){return ord[a.lvl]-ord[b.lvl];});
}

  var W=S.body.weeks;if(W.length<2)return '';

/* 1RM de los ejercicios de referencia en un día */
function exBest(e){var m=0,b=null;e.sets.forEach(function(x){if(x.w!=null&&x.r>0){var v=x.w*(1+x.r/30);if(v>m){m=v;b=x;}}});return b?{v:Math.round(m*10)/10,w:b.w,r:b.r}:null;}
function dayRM(k){
  var out=[],seen={};
  S.body.cfg.refs.forEach(function(id){
    if(!id||seen[id]||!S.exercises[id])return;seen[id]=1;
    var cur=null,prev=null,pt=0;
    S.sessions.forEach(function(s){var sk=dkey(s.date);
      s.entries.forEach(function(e){if(e.exId!==id)return;var b=exBest(e);if(!b)return;
        if(sk===k){if(!cur||b.v>cur.v)cur=b;}
        else if(sk<k&&s.date>=pt){pt=s.date;prev=b;}});});
    if(cur)out.push({name:S.exercises[id].name,b:cur,prev:prev});
  });
  return out;
}
function rmHtml(k){
  if(!S.body.cfg.refs.some(Boolean))return '<div class="mu" style="font-size:14px">Elige ejercicios de referencia en la configuración para ver aquí su 1RM estimado.</div>';
  var l=dayRM(k);
  if(!l.length)return '<div class="mu" style="font-size:14px">Este día no hay series de tus ejercicios de referencia.</div>';
  return l.map(function(o){var d=o.prev?o.b.v-o.prev.v:null;
    return '<div class="kv"><span>'+esc(o.name)+'</span><span><b>'+fmtN(o.b.v)+' kg</b> <span class="mu">('+fmtN(o.b.w)+'×'+o.b.r+')'+(d!=null&&Math.abs(d)>=0.05?' '+(d>0?'↑':'↓')+' '+sgn(d,1):'')+'</span></span></div>';}).join('');
}

/* ---------- comida: alimentos, recetas y diario ---------- */
function f0(n){return n==null?'—':String(Math.round(n));}
function f1(n){return n==null?'—':String(Math.round(n*10)/10).replace('.',',');}
function fin(n){return n==null?'':String(Math.round(n*100)/100).replace('.',',');}
function unitPl(w){return /[aeiou]$/i.test(w)?w+'s':w+'es';}
function shiftDay(k,n){var d=kdate(k);d.setDate(d.getDate()+n);return dkey(d);}
function normFood(f){
  f=f&&typeof f==='object'?f:{};
  var o={foods:Array.isArray(f.foods)?f.foods:[],recipes:Array.isArray(f.recipes)?f.recipes:[],log:f.log&&typeof f.log==='object'&&!Array.isArray(f.log)?f.log:{}};
  o.foods.forEach(function(x){if(x.carb===undefined)x.carb=null;if(x.fat===undefined)x.fat=null;});
  return o;
}
function getFood(id){return S.food.foods.filter(function(f){return f.id===id;})[0];}
function getRec(id){return S.food.recipes.filter(function(r){return r.id===id;})[0];}
function scl(v,g){return v==null?null:v*g/100;}
function perF(f,g){return {kcal:scl(f.kcal,g),prot:scl(f.prot,g),carb:scl(f.carb,g),fat:scl(f.fat,g)};}
function incomp(x){return x.kcal==null||x.prot==null||x.carb==null||x.fat==null;}
function mc(t,fn){fn=fn||f1;return 'P '+fn(t.prot)+' · H '+fn(t.carb)+' · G '+fn(t.fat)+' g';}
function scaleR(t,v){return {kcal:t.kcal*v,prot:t.prot*v,carb:t.carb*v,fat:t.fat*v};}
function recTot(r){
  var t={kcal:0,prot:0,carb:0,fat:0},miss=[],s=r.servings>0?r.servings:1;
  r.ing.forEach(function(i){var f=getFood(i.foodId);if(!f){miss.push('un ingrediente eliminado');return;}
    var v=perF(f,i.g);if(incomp(v))miss.push(f.name);t.kcal+=v.kcal||0;t.prot+=v.prot||0;t.carb+=v.carb||0;t.fat+=v.fat||0;});
  return {kcal:t.kcal/s,prot:t.prot/s,carb:t.carb/s,fat:t.fat/s,miss:miss};
}
function mkFood(f,g,text){var v=perF(f,g);return {type:'food',refId:f.id,name:f.name,g:g,qtyText:text,kcal:v.kcal,prot:v.prot,carb:v.carb,fat:v.fat,t:Date.now()};}
function fEnt(k){return S.food.log[k]||[];}
function fPush(k,e){e.id=uid();(S.food.log[k]||(S.food.log[k]=[])).push(e);ensureDay(k);}
function fTot(k){var t={kcal:0,prot:0,carb:0,fat:0,miss:0,n:0};fEnt(k).forEach(function(e){t.n++;if(incomp(e))t.miss++;t.kcal+=e.kcal||0;t.prot+=e.prot||0;t.carb+=e.carb||0;t.fat+=e.fat||0;});return t;}
function foodTot(k){var t=fTot(k);return t.n?t:null;}
function lastUse(id){var b=null;Object.keys(S.food.log).forEach(function(k){S.food.log[k].forEach(function(e){if(e.refId===id&&e.type==='food'&&(!b||e.t>b.t))b={t:e.t,g:e.g};});});return b;}
function guard(k,fn){
  var r=S.body.days[k];
  if(r&&r.closed)ask('Editar un día cerrado','Este día ya está en una semana cerrada. Si lo editas, el cambio no se reflejará en esa media y el día volverá a quedar pendiente: se contará en el próximo cierre.','Editar de todos modos',function(){r.closed=null;save();fn();});
  else fn();
}

function readFoodForm(old){

function fillList(q){
  var el=document.getElementById('flist');if(!el)return;q=q.trim().toLowerCase();
  var list=S.food.foods.filter(function(f){return !q||f.name.toLowerCase().indexOf(q)>=0;}).map(function(f){var u=lastUse(f.id);return {f:f,t:u?u.t:0};})
    .sort(function(a,b){return ((b.f.fav?1:0)-(a.f.fav?1:0))||(b.t-a.t)||a.f.name.localeCompare(b.f.name,'es');});
  el.innerHTML=list.map(function(o){var f=o.f,u=lastUse(f.id);
    return '<button class="fpi" data-m="pickfood" data-id="'+f.id+'"><span class="t"><b>'+(f.fav?'★ ':'')+esc(f.name)+'</b><small>'+f0(f.kcal)+' kcal · '+mc(f)+' por 100 g'+(u?' · última vez '+f0(u.g)+' g':'')+'</small></span>'+(incomp(f)?'<span class="st">!</span>':'')+'</button>';}).join('')||
    '<p class="mu">'+(S.food.foods.length?'Sin resultados. Crea el alimento en la pestaña Nuevo.':'Todavía no tienes alimentos. Escanea un código en la pestaña Código o crea uno en la pestaña Nuevo.')+'</p>';

function dupToday(e){return fEnt(ui.fDate).some(function(x){return x.type===e.type&&(e.refId?x.refId===e.refId:(x.name===e.name&&Math.round(x.kcal)===Math.round(e.kcal)));});}
function cloneEntry(e){
  if(e.type==='food'){var f=getFood(e.refId);if(f)return mkFood(f,e.g,e.qtyText);}
  else if(e.type==='recipe'){var r=getRec(e.refId);
    if(r){var v=scaleR(recTot(r),e.qty);return {type:'recipe',refId:r.id,name:r.name,qty:e.qty,qtyText:e.qtyText,kcal:v.kcal,prot:v.prot,carb:v.carb,fat:v.fat,t:Date.now()};}}
  var c=JSON.parse(JSON.stringify(e));delete c.id;c.t=Date.now();return c;
}
function wireCopy(){
  var btn=document.getElementById('copyBtn');if(!btn)return;
  function upd(){var n=Object.keys(ui.copyPick).filter(function(i){return ui.copyPick[i];}).length;btn.textContent='Añadir '+n+(n===1?' entrada':' entradas')+' a este día';btn.style.opacity=n?'':'.5';}
  Array.prototype.forEach.call($modal.querySelectorAll('[data-cp]'),function(c){c.addEventListener('change',function(){ui.copyPick[c.dataset.cp]=c.checked;upd();});});
  upd();
}

/* cantidad */
function qtySheet(kind,item,mode,val){
  var isF=kind==='food',u=isF&&item.unit?item.unit:null,lu=isF?lastUse(item.id):null;
  mode=mode||(u?'u':'g');
  if(val==null){var g0=isF?(lu?lu.g:(u?u.g:100)):1;val=isF?(mode==='u'?Math.round(g0/u.g*10)/10:g0):1;}
  var label=isF?(mode==='u'?'Cantidad ('+unitPl(u.name)+')':'Cantidad (gramos)'):'Raciones';
  var base=isF?'Por 100 g: '+f0(item.kcal)+' kcal · '+mc(item):'Por ración: '+f0(recTot(item).kcal)+' kcal · '+mc(recTot(item));

/* ---------- Open Food Facts y escáner ---------- */
function offNum(n,k){var v=n[k];if(v==null||v==='')return null;v=parseFloat(v);return isFinite(v)?v:null;}
function parseProduct(p,code,anyName){
  if(!p)return null;var n=p.nutriments||{};
  var kcal=offNum(n,'energy-kcal_100g');if(kcal==null){var kj=offNum(n,'energy_100g');if(kj!=null)kcal=kj/4.184;}
  var name=String(p.product_name||'').trim();
  if(!name){if(!anyName)return null;name='Producto '+code;}
  var br=Array.isArray(p.brands)?p.brands[0]:String(p.brands||'').split(',')[0];br=String(br||'').trim();
  if(br&&name.toLowerCase().indexOf(br.toLowerCase())<0)name+=' – '+br;
  var sq=parseFloat(p.serving_quantity);
  return {name:name,kcal:kcal,prot:offNum(n,'proteins_100g'),carb:offNum(n,'carbohydrates_100g'),fat:offNum(n,'fat_100g'),unit:sq>0?{name:'ración',g:sq}:null,code:String(code||p.code||'')};
}
function parseOFF(j,code){
  if(!j||j.status!==1||!j.product)return null;
  return parseProduct(j.product,code,true);
}
var lk=null,lkFood=null;
function runLookup(raw,hd){
  var box=document.getElementById('codeRes');if(!box)return;
  var code=String(raw||'').replace(/\D/g,'');
  function warn(t){box.innerHTML='<div class="warn" style="margin-top:12px">'+t+'</div>';}
  if(code.length<8||code.length>14){warn('El código debe tener entre 8 y 14 dígitos.');return;}
  hd.uselk=function(){qtySheet('food',lkFood);};
  hd.savelk=function(){var f={id:uid(),name:lk.name,kcal:lk.kcal,prot:lk.prot,carb:lk.carb,fat:lk.fat,unit:lk.unit,fav:false,code:lk.code};S.food.foods.push(f);save();qtySheet('food',f);};
  var mine=S.food.foods.filter(function(f){return f.code===code;})[0];
  if(mine){lkFood=mine;box.innerHTML='<div class="prev"><b>'+esc(mine.name)+'</b><br>Ya está en tus alimentos. Por 100 g: '+f0(mine.kcal)+' kcal · '+mc(mine)+'</div><button class="btn" data-m="uselk">Añadir</button>';return;}
  box.innerHTML='<p class="mu" style="margin-top:12px">Buscando…</p>';
  var ctl=typeof AbortController!=='undefined'?new AbortController():null,to=setTimeout(function(){if(ctl)ctl.abort();},9000);
  fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'?fields=product_name,brands,nutriments,serving_quantity',ctl?{signal:ctl.signal}:{})
    .then(function(r){return r.json();})
    .then(function(j){
      clearTimeout(to);if(!document.getElementById('codeRes'))return;
      var p=parseOFF(j,code);
      if(!p){warn('No hay ningún producto con el código '+code+' en Open Food Facts. Puedes crearlo a mano en la pestaña Nuevo.');return;}
      lk=p;
      document.getElementById('codeRes').innerHTML='<div class="prev"><b>'+esc(p.name)+'</b><br>Por 100 g: '+f0(p.kcal)+' kcal · '+mc(p)+(incomp(p)?'<br><span style="color:var(--wa)">Faltan datos en la ficha del producto. Puedes completarlos después en Mis alimentos.</span>':'')+'</div><button class="btn" data-m="savelk">Guardar en mis alimentos y añadir</button>';
    })
    .catch(function(){clearTimeout(to);if(document.getElementById('codeRes'))warn('No se pudo consultar Open Food Facts. Comprueba la conexión o crea el alimento a mano en la pestaña Nuevo.');});
}
var srT=[];
function fetchJSON(url){
  return new Promise(function(res,rej){
    var ctl=typeof AbortController!=='undefined'?new AbortController():null,to=setTimeout(function(){if(ctl)ctl.abort();},10000);
    fetch(url,ctl?{signal:ctl.signal}:{}).then(function(r){if(!r.ok)throw new Error('http');return r.json();}).then(function(j){clearTimeout(to);res(j);}).catch(function(e){clearTimeout(to);rej(e);});
  });
}
function doSearch(raw,hd){
  var q=String(raw||'').trim();
  if(/^[\d\s-]{8,18}$/.test(q)&&q.replace(/\D/g,'').length>=8){runLookup(q,hd);return;}
  searchName(q);
}
function searchName(q){
  var box=document.getElementById('codeRes');if(!box)return;
  function warn(t){box.innerHTML='<div class="warn" style="margin-top:12px">'+t+'</div>';}
  if(q.length<2){warn('Escribe al menos dos letras del nombre.');return;}
  var now=Date.now();srT=srT.filter(function(t){return now-t<60000;});
  if(srT.length>=8){warn('Has hecho muchas búsquedas seguidas. Open Food Facts limita las búsquedas por nombre: espera un minuto.');return;}
  srT.push(now);
  box.innerHTML='<p class="mu" style="margin-top:12px">Buscando…</p>';
  var sp=ui.fSpain!==false,enc=encodeURIComponent(q),F='code,product_name,brands,nutriments,serving_quantity';
  var u1='https://world.openfoodfacts.org/cgi/search.pl?search_terms='+enc+'&search_simple=1&action=process&json=1&page_size=24&fields='+F+(sp?'&tagtype_0=countries&tag_contains_0=contains&tag_0=spain':'');
  var u2='https://search.openfoodfacts.org/search?q='+encodeURIComponent(q+(sp?' countries_tags:"en:spain"':''))+'&page_size=24&fields='+F;
  function list(j){return Array.isArray(j&&j.products)?j.products:(Array.isArray(j&&j.hits)?j.hits:null);}
  fetchJSON(u1).then(function(j){if(!list(j))throw new Error('formato');return j;}).catch(function(){return fetchJSON(u2);}).then(function(j){
    if(!document.getElementById('codeRes'))return;
    var arr=list(j);if(!arr)throw new Error('formato');
    var res=arr.map(function(p){return parseProduct(p,p.code,false);}).filter(function(x){return x&&x.code;});
    res=res.filter(function(x){return x.kcal!=null;}).concat(res.filter(function(x){return x.kcal==null;}));
    ui.fres=res;
    if(!res.length){warn('No hay resultados para «'+esc(q)+'»'+(sp?' entre los productos de España. Prueba a quitar el filtro de España':'')+'. También puedes crear el alimento a mano en la pestaña Nuevo.');return;}
    document.getElementById('codeRes').innerHTML='<h2 style="margin-top:14px">Resultados</h2><div class="plist" style="max-height:40vh">'+res.map(function(x,i){
      return '<button class="fpi" data-m="pickres" data-i="'+i+'"><span class="t"><b>'+esc(x.name)+'</b><small>'+(x.kcal==null?'Sin datos de energía':f0(x.kcal)+' kcal · '+mc(x)+' por 100 g')+'</small></span>'+(incomp(x)?'<span class="st">!</span>':'')+'</button>';}).join('')+'</div>';
  }).catch(function(){if(document.getElementById('codeRes'))warn('No se pudo buscar en Open Food Facts: puede faltar conexión o la búsqueda no estar disponible. Prueba con el código de barras o crea el alimento a mano en la pestaña Nuevo.');});
}
function pickResult(i){

  if(mine){qtySheet('food',mine);return;}
  qtySheet('food',{id:uid(),name:p.name,kcal:p.kcal,prot:p.prot,carb:p.carb,fat:p.fat,unit:p.unit,fav:false,code:p.code,pending:true});

var scan=null,zxr=null;
function stopScan(){
  if(!scan)return;
  try{if(scan.timer)clearInterval(scan.timer);}catch(e){}
  try{if(scan.stream)scan.stream.getTracks().forEach(function(t){t.stop();});}catch(e){}
  scan=null;
}
function loadZX(){return new Promise(function(res,rej){
  if(window.ZXing)return res();
  var s=document.createElement('script');s.src='zxing.min.js';s.onload=function(){window.ZXing?res():rej();};s.onerror=rej;document.head.appendChild(s);});}
function zxDecode(cv){
  if(!zxr){var hints=new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER,true);zxr=new ZXing.MultiFormatReader();zxr.setHints(hints);}
  return zxr.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(cv)))).getText();
}
function toCanvas(src,w,h,max){
  var s=Math.min(1,max/Math.max(w,h)),cv=document.createElement('canvas');cv.width=Math.round(w*s);cv.height=Math.round(h*s);
  cv.getContext('2d').drawImage(src,0,0,cv.width,cv.height);return cv;
}
function openScan(onCode){
  modal('<h3>Escanear código</h3><div class="scanbox"><video id="scanv" playsinline muted autoplay></video><div class="scanframe"></div></div><p class="mu" id="scanmsg" style="margin:10px 0;font-size:14px">Apunta al código de barras del producto, con buena luz.</p>'+
    '<label class="btn sec small" style="text-align:center;cursor:pointer;margin-bottom:10px">Hacer foto del código<input id="scanfile" type="file" accept="image/*" capture="environment" style="display:none"></label><button class="btn ghost" data-m="scanclose">Cancelar</button>',
    {scanclose:closeModal});
  var v=document.getElementById('scanv'),msg=document.getElementById('scanmsg'),det=null;
  function fail(t){msg.textContent=t;msg.style.color='var(--wa)';}
  function done(code){if(!scan&&!v)return;stopScan();vib(80);closeModal();onCode(code);}
  try{if(typeof BarcodeDetector!=='undefined')det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});}catch(e){det=null;}
  document.getElementById('scanfile').addEventListener('change',function(ev){
    var f=ev.target.files&&ev.target.files[0];if(!f)return;msg.style.color='';msg.textContent='Leyendo la foto…';
    var img=new Image(),url=URL.createObjectURL(f);
    img.onload=function(){
      var cv=toCanvas(img,img.naturalWidth,img.naturalHeight,1600);URL.revokeObjectURL(url);
      function bad(){fail('No se ha podido leer el código en la foto. Prueba más cerca, con más luz y bien enfocado.');}
      if(det){det.detect(cv).then(function(r){if(r&&r.length)done(r[0].rawValue);else bad();}).catch(bad);}
      else loadZX().then(function(){try{done(zxDecode(cv));}catch(e){bad();}}).catch(function(){fail('No se pudo cargar el lector. Escribe el código a mano.');});
    };
    img.onerror=function(){fail('No se pudo abrir la foto.');};img.src=url;
  });
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){fail('Este navegador no permite usar la cámara. Haz una foto del código o escríbelo a mano.');return;}
  scan={};
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(function(stream){
    if(!scan){stream.getTracks().forEach(function(t){t.stop();});return;}
    scan.stream=stream;v.srcObject=stream;var pl=v.play();if(pl&&pl.catch)pl.catch(function(){});
    function loop(){
      scan.timer=setInterval(function(){
        if(!scan||scan.busy||v.readyState<2||!v.videoWidth)return;scan.busy=true;
        try{
          if(det){det.detect(v).then(function(r){if(scan)scan.busy=false;if(r&&r.length)done(r[0].rawValue);}).catch(function(){if(scan)scan.busy=false;});}
          else{var cv=toCanvas(v,v.videoWidth,v.videoHeight,800),c=null;try{c=zxDecode(cv);}catch(e){}scan.busy=false;if(c)done(c);}
        }catch(e){if(scan)scan.busy=false;}
      },det?250:200);
    }
    if(det)loop();else loadZX().then(function(){if(scan)loop();}).catch(function(){fail('No se pudo cargar el lector. Haz una foto del código o escríbelo a mano.');});
  }).catch(function(e){
    scan=null;
    fail(e&&e.name==='NotAllowedError'?'No hay permiso para usar la cámara. Actívalo en los ajustes del navegador, o haz una foto del código, o escríbelo a mano.':'No se pudo abrir la cámara. Haz una foto del código o escríbelo a mano.');
  });
}

    if(v==null){var p=e.sets[si-1];v=p&&p[f]!=null?p[f]:0;}
    s[f]=Math.max(0,Math.round((v+d*stp)*100)/100);save();render(true);
  },
  chk:function(el){
    var e=cE(el),ei=+el.dataset.ei,s=e.sets[+el.dataset.si],ex=S.exercises[e.exId];
    if(!s.done){
      if(!(s.r>0)){toast(ex.type==='time'?'Falta el tiempo':'Faltan las reps');return;}
      if(ex.type==='weight'&&s.w==null){toast('Falta el peso');return;}
      s.done=true;
    }else s.done=false;
    save();
    if(s.done)startRest(e);
    if(s.done&&entryDone(e)){var nx=nextUndone(ei);if(nx>=0){ui.open=nx;render(true);scrollToEntry(nx);return;}}
    render(true);
  },
  copy:function(el){
    var e=cE(el),i=e.sets.findIndex(function(s){return !s.done;});
    if(i<0){toast('Todas las series están hechas');return;}
    if(i===0){toast('Aún no hay serie anterior');return;}
    e.sets[i].w=e.sets[i-1].w;e.sets[i].r=e.sets[i-1].r;save();render(true);
  },
  addset:function(el){var e=cE(el),l=e.sets[e.sets.length-1]||{w:null,r:null};e.sets.push({w:l.w,r:l.r,done:false});save();render(true);},
  rmset:function(el){var e=cE(el);if(e.sets.length>1){if(tm&&tm.ei===+el.dataset.ei&&tm.si===e.sets.length-1)stopTimerSilently();e.sets.pop();save();render(true);}},
  subst:function(el){
    var ei=+el.dataset.ei,ex=S.current.entries.map(function(e){return e.exId;});
    pickEx(ex,function(id){var e=S.current.entries[ei];e.replaces=e.replaces||e.exId;e.exId=id;e.sets=mkEntry(id).sets;save();render(true);});
  },
  unsubst:function(el){var e=cE(el);if(e.replaces){e.exId=e.replaces;e.replaces=null;e.sets=mkEntry(e.exId).sets;save();render(true);}},
  tmr:function(el){
    var ei=+el.dataset.ei,si=+el.dataset.si;
    if(tm){if(tm.ei===ei&&tm.si===si)stopTimer();else toast('Para antes el cronómetro en marcha');return;}
    tm={ei:ei,si:si,t0:Date.now(),vMin:false,vMax:false};lock();render(true);
  },
  lumb:function(el){S.current.discomfort=+el.dataset.v;save();render(true);},
  finish:function(){finishSession();},
  discard:function(){ask('Descartar sesión','Se perderán las series de esta sesión.','Descartar',function(){stopTimerSilently();stopRest();S.current=null;save();go('hoy');});},
  seg:function(el){ui.seg=el.dataset.v;render(false);},
  metric:function(el){ui.metric=+el.dataset.v;render(true);},
  /* rutina */
  addday:function(){var d={id:uid(),name:'Día '+(S.days.length+1),exIds:[]};S.days.push(d);save();ui.dayId=d.id;go('rut_dia');},
  openday:function(el){ui.dayId=el.dataset.id;go('rut_dia');},
  dayup:function(el){var i=+el.dataset.i;if(i>0){var t=S.days[i];S.days[i]=S.days[i-1];S.days[i-1]=t;save();render(true);}},
  daydn:function(el){var i=+el.dataset.i;if(i<S.days.length-1){var t=S.days[i];S.days[i]=S.days[i+1];S.days[i+1]=t;save();render(true);}},
  dupday:function(){var d=curDay();var c={id:uid(),name:d.name+' (copia)',exIds:d.exIds.slice()};S.days.splice(S.days.indexOf(d)+1,0,c);save();ui.dayId=c.id;render(false);window.scrollTo(0,0);toast('Día duplicado');},
  delday:function(){var d=curDay();ask('Eliminar día','Se elimina «'+d.name+'» de la rutina. Tu progreso no se toca.','Eliminar',function(){S.days=S.days.filter(function(x){return x!==d;});if(S.current&&S.current.dayId===d.id){S.current=null;}save();go('rutina');});},
  addex:function(){var d=curDay();pickEx(d.exIds,function(id){d.exIds.push(id);save();render(true);});},
  exup:function(el){var d=curDay(),i=+el.dataset.i;if(i>0){var t=d.exIds[i];d.exIds[i]=d.exIds[i-1];d.exIds[i-1]=t;save();render(true);}},
  exdn:function(el){var d=curDay(),i=+el.dataset.i;if(i<d.exIds.length-1){var t=d.exIds[i];d.exIds[i]=d.exIds[i+1];d.exIds[i+1]=t;save();render(true);}},
  exrm:function(el){var d=curDay();d.exIds.splice(+el.dataset.i,1);save();render(true);},
  exsets:function(el){var ex=S.exercises[ui.id];ex.sets=Math.max(1,ex.sets+(+el.dataset.d));save();render(true);},
  delex:function(){
    var ex=S.exercises[ui.id];
    ask('Eliminar ejercicio','Sale de todos los días. Si tiene historial, el progreso se conserva en Progreso.','Eliminar',function(){
      S.days.forEach(function(d){d.exIds=d.exIds.filter(function(i){return i!==ex.id;});});
      if(!hist(ex.id).length)delete S.exercises[ex.id];
      save();go(ui.dayId&&curDay()?'rut_dia':'rutina');});
  },
  rskip:function(){stopRest();},
  /* comida */
  gocomida:function(){ui.fDate=ui.bDate||dkey(Date.now());go('comida');},
  fnav:function(el){var nk=shiftDay(ui.fDate,+el.dataset.d);if(nk>dkey(Date.now()))return;ui.fDate=nk;ui.fsel=false;ui.fpicked={};ui.copyFrom=null;ui.copyPick=null;render(true);},
  fbunlock:function(){var r=S.body.days[ui.fDate];ask('Editar un día cerrado','Este día ya está en una semana cerrada. Si lo editas, el cambio no se reflejará en esa media y el día volverá a quedar pendiente: se contará en el próximo cierre.','Editar de todos modos',function(){r.closed=null;save();render(true);});},
  fadd:function(){guard(ui.fDate,function(){openAdd('foods');});},
  fcopyy:function(){guard(ui.fDate,function(){ui.copyFrom=null;ui.copyPick=null;openAdd('copy');});},
  fedit:function(el){var id=el.dataset.id;guard(ui.fDate,function(){editEntry(id);});},
  fsel:function(){ui.fsel=!ui.fsel;ui.fpicked={};render(true);},
  fsaverec:function(){
    var ids=Object.keys(ui.fpicked).filter(function(i){return ui.fpicked[i];});if(!ids.length){toast('Marca alguna entrada');return;}
    var ing=[];fEnt(ui.fDate).forEach(function(e){if(ids.indexOf(e.id)>=0&&e.type==='food'&&getFood(e.refId))ing.push({foodId:e.refId,g:e.g});});
    recipeEditor({name:'',servings:1,ing:ing});
  },
  ffix:function(){guard(ui.fDate,function(){
    var T=fTot(ui.fDate);
    modal('<h3>Corregir totales a mano</h3><p class="mu">Escribe el total real del día. La app añade una línea «Ajuste» con la diferencia en cada valor.</p><div class="two"><div><label class="lbl" for="x-k">Kcal del día</label><input id="x-k" inputmode="decimal" value="'+f0(T.kcal)+'"></div><div><label class="lbl" for="x-p">Proteína del día (g)</label><input id="x-p" inputmode="decimal" value="'+f0(T.prot)+'"></div></div><div class="two"><div><label class="lbl" for="x-c">Hidratos del día (g)</label><input id="x-c" inputmode="decimal" value="'+f0(T.carb)+'"></div><div><label class="lbl" for="x-f">Grasas del día (g)</label><input id="x-f" inputmode="decimal" value="'+f0(T.fat)+'"></div></div><div style="height:14px"></div><button class="btn" data-m="ok">Guardar</button><button class="btn ghost" data-m="close">Cancelar</button>',
      {close:closeModal,ok:function(){
        var k=parseN(document.getElementById('x-k').value),p=parseN(document.getElementById('x-p').value),c=parseN(document.getElementById('x-c').value),fa=parseN(document.getElementById('x-f').value);
        if(k==null||p==null||c==null||fa==null){toast('Indica los cuatro totales');return;}
        var dk=k-T.kcal,dp=p-T.prot,dc=c-T.carb,df=fa-T.fat;if(Math.abs(dk)<0.5&&Math.abs(dp)<0.05&&Math.abs(dc)<0.05&&Math.abs(df)<0.05){closeModal();return;}
        var ad=fEnt(ui.fDate).filter(function(e){return e.type==='adjust';})[0];
        if(ad){ad.kcal+=dk;ad.prot+=dp;ad.carb=(ad.carb||0)+dc;ad.fat=(ad.fat||0)+df;}
        else fPush(ui.fDate,{type:'adjust',name:'Ajuste',qtyText:'Corrección manual del total',kcal:dk,prot:dp,carb:dc,fat:df,t:Date.now()});
        save();closeModal();render(true);toast('Ajuste añadido');}});
  });},
  ffav:function(el){var f=getFood(el.dataset.id);f.fav=!f.fav;save();render(true);},
  fdelfood:function(el){var f=getFood(el.dataset.id);ask('Eliminar alimento','«'+f.name+'» desaparece de tus alimentos. Lo ya apuntado en la lista no cambia.','Eliminar',function(){S.food.foods=S.food.foods.filter(function(x){return x.id!==f.id;});save();render(true);});},
  fdelrec:function(el){var r=getRec(el.dataset.id);ask('Eliminar receta','«'+r.name+'» desaparece de tus recetas. Lo ya apuntado en la lista no cambia.','Eliminar',function(){S.food.recipes=S.food.recipes.filter(function(x){return x.id!==r.id;});save();render(true);});},
  fnewrec:function(){recipeEditor(null);},
  feditrec:function(el){var r=getRec(el.dataset.id);recipeEditor({name:r.name,servings:r.servings,ing:r.ing.map(function(i){return {foodId:i.foodId,g:i.g};})},r.id);},
  feditfood:function(el){var f=getFood(el.dataset.id);
    modal('<h3>Editar alimento</h3>'+foodForm(f)+'<div style="height:14px"></div><button class="btn" data-m="save">Guardar</button><button class="btn ghost" data-m="close">Cancelar</button>',
      {close:closeModal,save:function(){if(readFoodForm(f)){save();closeModal();render(true);toast('Guardado');}}});},
  /* cuerpo */
  bnav:function(el){var k=ui.bDate||dkey(Date.now()),n=new Date(kdate(k));n.setDate(n.getDate()+(+el.dataset.d));var nk=dkey(n);if(nk>dkey(Date.now()))return;ui.bDate=nk;ui.bBreak=false;render(true);},
  bopt:function(){ui.bOpt=!ui.bOpt;render(true);},
  bbreak:function(){ui.bBreak=!ui.bBreak;render(true);},
  bscale:function(el){var r=ensureDay(ui.bDate);if(r.closed)return;var f=el.dataset.f,v=+el.dataset.v;if(r[f]===v)delete r[f];else r[f]=v;save();render(true);},
  bunlock:function(){var r=S.body.days[ui.bDate];ask('Editar un día cerrado','Este día ya está en una semana cerrada. Si lo editas, el cambio no se reflejará en esa media y el día volverá a quedar pendiente: se contará en el próximo cierre.','Editar de todos modos',function(){r.closed=null;save();render(true);});},
  wclose:function(){openClose();},
  /* datos */
  exp:function(el){ui.msg=null;doExport(el.dataset.k);},
  copyout:function(){
    var t=document.getElementById('out');t.focus();t.select();
    var ok=false;try{ok=document.execCommand('copy');}catch(e){}
    if(!ok&&navigator.clipboard){navigator.clipboard.writeText(t.value).then(function(){toast('Copiado');},function(){toast('Selecciona y copia a mano');});}
    else toast(ok?'Copiado':'Selecciona y copia a mano');
  },
  imptext:function(){var v=document.getElementById('paste').value.trim();if(!v){toast('Pega primero el JSON');return;}ui.msg=null;importText(v);},
  wipe:function(){ask('Borrar todo','Se eliminan tu rutina y todo tu progreso. No se puede deshacer.','Borrar todo',function(){S=blank();S.body=normBody(null);S.food=normFood(null);stopTimerSilently();save();ui.msg={t:'Datos borrados.'};render(true);});}
};

/* ---------- eventos ---------- */
document.addEventListener('click',function(ev){
  var m=ev.target.closest('[data-m]');
  if(m&&modalH[m.dataset.m]){modalH[m.dataset.m](m);return;}
  if(ev.target===$modal){closeModal();return;}
  var el=ev.target.closest('[data-act]');
  if(el&&A[el.dataset.act])A[el.dataset.act](el);
});
document.addEventListener('change',function(ev){
  var el=ev.target,b=el.dataset&&el.dataset.bind;
  if(el.id==='file'){
    var f=el.files&&el.files[0];if(!f)return;
    var r=new FileReader();r.onload=function(){ui.msg=null;importText(String(r.result));};
    r.onerror=function(){ui.msg={err:1,t:'No se pudo leer el archivo.'};render(true);};
    r.readAsText(f);return;
  }
  if(el.dataset&&el.dataset.pick){ui.fpicked[el.dataset.pick]=el.checked;render(true);return;}
  if(!b)return;
  if(b==='fsw'){var fr=ensureDay(ui.fDate);if(fr.closed)return;fr.trained=el.checked;save();render(true);return;}
  if(b==='bday'){
    var bk=ui.bDate,br=ensureDay(bk);if(br.closed)return;
    var bv=parseN(el.value),bf=el.dataset.f;
    if(bv==null||bv<0)delete br[bf];else br[bf]=bf==='steps'?Math.round(bv):bv;
    save();refreshLive();return;
  }
  if(b==='bsw'){var sr=ensureDay(ui.bDate);if(sr.closed)return;sr[el.dataset.f]=el.checked;save();render(true);return;}
  if(b==='cfg'){
    var cc=S.body.cfg,cf=el.dataset.f;
    if(cf==='birth')cc.birth=el.value||null;
    else if(cf==='phase')cc.phase=el.value;
    else if(cf.indexOf('ref')===0)cc.refs[+cf.slice(3)]=el.value||null;
    else{var cn=parseN(el.value);if(cn==null||cn<=0){el.value=fmtN(cc[cf]);return;}cc[cf]=cn;}
    Object.keys(S.body.days).forEach(function(k){freeze(S.body.days[k],cc);});
    save();return;
  }
  if(b==='set'){
    var e=S.current.entries[+el.dataset.ei],s=e.sets[+el.dataset.si],v=parseN(el.value);
    s[el.dataset.f]=v;
    if(v==null||(el.dataset.f==='r'&&v<=0)){if(s.done){s.done=false;var row=el.closest('.srow');if(row)row.classList.remove('done');}}
    save();return;
  }
  if(b==='day'){var d=curDay();if(d&&el.value.trim()){d.name=el.value.trim();save();}return;}
  var ex=S.exercises[ui.id];if(!ex)return;
  if(b==='extype'){
    ex.type=el.value;var df=newEx('x',ex.type);ex.min=df.min;ex.max=df.max;ex.step=df.step;save();render(true);return;
  }
  var f2=el.dataset.f;
  if(f2==='name'){if(el.value.trim())ex.name=el.value.trim();else el.value=ex.name;}
  else if(f2==='note')ex.note=el.value.trim();
  else if(f2==='back')ex.back=el.checked;
  else{
    var n=parseN(el.value);
    if(n==null||n<0){el.value=fmtN(ex[f2]);return;}
    if(f2==='rest')n=Math.round(n);
    ex[f2]=n;
    if(ex.max<ex.min){if(f2==='min')ex.max=n;else ex.min=n;render(true);}
  }
  save();
});

S.body=normBody(S.body);S.food=normFood(S.food);save();
ui.screen=S.current?'hoy':'cuerpo';
render(false);
})();
</script>

if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
